name: ai-service

on:
  push:
    paths:
      - "ai/sync-agent-service/**"
      - ".github/workflows/ai-service.yml"
  pull_request:
    paths:
      - "ai/sync-agent-service/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/sync-agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Ruff lint
        run: ruff check app tests
      - name: Compile check
        run: python -m compileall -q app
      - name: Unit + eval tests (offline)
        run: pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sync-ai:ci ai/sync-agent-service
