name: app-cicd

# ─────────────────────────────────────────────────────────────────────────────
# Build ALL Docker images → ECR → rolling ECS deploy (prod). Optional web S3.
# Infra Terraform: KHÔNG trong pipeline này — apply local (terraform apply).
#
# Main push / manual Run workflow:
#   Always matrix full fleet:
#   gateway,iam,roadmap,exercise,nutrition,marketplace,order,payment,
#   notification,social,ai,rcm  (+ ai-worker when ai deploys)
#
# Secrets/vars (GitHub → Settings → Secrets/Variables → Actions):
#   secrets: AWS_OIDC_ROLE_ARN
#   vars:    AWS_REGION, ECR_REGISTRY, ECS_CLUSTER_PROD
#            SYNC_PUBLIC_URL_PROD (smoke optional)
#            WEB_BUCKET_PROD / WEB_DISTRIBUTION_ID_PROD (web only)
#            ECS_CLUSTER_DEV optional (skip if empty)
#   environment "production" may require approval for deploy-prod / deploy-web-prod
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "ai/**"
      - "ui/web/**"
      - ".github/workflows/app-cicd.yml"
      - ".github/scripts/ecs-deploy.sh"
      - ".github/scripts/ecs-bluegreen.sh"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "ai/**"
      - "ui/web/**"
      - ".github/workflows/app-cicd.yml"
  workflow_dispatch:
    inputs:
      include_web:
        description: "Also build + deploy ui/web to S3/CloudFront"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: app-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  # step-level only
  IS_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      web: ${{ steps.matrix.outputs.web }}
      is_release: ${{ steps.matrix.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            web: 'ui/web/**'
      - id: matrix
        name: Full fleet matrix (always all services on main)
        env:
          WEB_PATH: ${{ steps.filter.outputs.web || 'false' }}
          INCLUDE_WEB: ${{ github.event_name == 'workflow_dispatch' && inputs.include_web || false }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          all_services = [
              "gateway", "iam", "roadmap", "exercise", "nutrition",
              "marketplace", "order", "payment", "notification", "social",
              "ai", "rcm",
          ]
          event = os.environ.get("EVENT", "")
          ref = os.environ.get("REF", "")
          is_release = (
              (event == "push" and ref == "refs/heads/main")
              or (event == "workflow_dispatch" and ref == "refs/heads/main")
          )
          # PR: still build-all so matrix is valid; release steps skip push/deploy
          docker = all_services
          web = "false"
          if event == "workflow_dispatch":
              web = "true" if os.environ.get("INCLUDE_WEB", "").lower() in ("true", "1") else "false"
          elif os.environ.get("WEB_PATH") == "true":
              web = "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"services={json.dumps(docker)}\n")
              f.write(f"web={web}\n")
              f.write(f"is_release={str(is_release).lower()}\n")
          print("services:", docker)
          print("web:", web, "is_release:", is_release)
          PY

  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: .NET tests (non-blocking)
        run: dotnet test core/SyncPlatform --nologo --verbosity quiet || echo "no/failed tests (placeholder)"
      - name: Python lint + tests (non-blocking)
        working-directory: ai/sync-agent-service
        run: |
          python -m pip install -q ".[dev]" || true
          ruff check app || true
          pytest -q tests || echo "no/failed py tests (placeholder)"

  build-push:
    needs: [detect]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail-fast required config (release)
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          OIDC_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          [ -n "${OIDC_ROLE}" ] || { echo "::error::Missing secret AWS_OIDC_ROLE_ARN"; exit 1; }
          [ -n "${{ env.ECR_REGISTRY }}" ] || { echo "::error::Missing var ECR_REGISTRY"; exit 1; }

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3

      - name: Resolve build args
        id: meta
        run: |
          case "${{ matrix.service }}" in
            gateway)      CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Gateway/Gateway.API.csproj ;;
            iam)          CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Iam/Iam.API/Iam.API.csproj ;;
            roadmap)      CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Roadmap/Roadmap.API/Roadmap.API.csproj ;;
            exercise)     CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Exercise/Exercise.API/Exercise.API.csproj ;;
            nutrition)    CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Nutrition/Nutrition.API/Nutrition.API.csproj ;;
            marketplace)  CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Marketplace/Marketplace.API/Marketplace.API.csproj ;;
            order)        CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Order/Order.API/Order.API.csproj ;;
            payment)      CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Payment/Payment.API/Payment.API.csproj ;;
            notification) CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Notification/Notification.API/Notification.API.csproj ;;
            social)       CTX=core/SyncPlatform; DF=core/SyncPlatform/Dockerfile; PROJECT=src/Services/Social/Social.API/Social.API.csproj ;;
            ai)           CTX=ai/sync-agent-service; DF=ai/sync-agent-service/Dockerfile; PROJECT="" ;;
            rcm)          CTX=ai/sync-rcm-service; DF=ai/sync-rcm-service/Dockerfile; PROJECT="" ;;
            *) echo "Unknown service ${{ matrix.service }}"; exit 1 ;;
          esac
          {
            echo "ctx=$CTX"
            echo "df=$DF"
            echo "project=$PROJECT"
            echo "image=$ECR_REGISTRY/sync/${{ matrix.service }}:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image (linux/arm64)
        run: |
          ARGS=()
          [ -n "${{ steps.meta.outputs.project }}" ] && ARGS+=(--build-arg "PROJECT=${{ steps.meta.outputs.project }}")
          docker buildx build \
            --platform linux/arm64 \
            -f "${{ steps.meta.outputs.df }}" \
            "${ARGS[@]}" \
            -t "${{ steps.meta.outputs.image }}" \
            --load \
            "${{ steps.meta.outputs.ctx }}"

      - name: Trivy scan (warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Configure AWS (OIDC)
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ECR login
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image (tag=sha)
        if: ${{ env.IS_RELEASE == 'true' }}
        run: docker push "${{ steps.meta.outputs.image }}"
      - name: Also tag :latest
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          SRC="${{ steps.meta.outputs.image }}"
          LATEST="$ECR_REGISTRY/sync/${{ matrix.service }}:latest"
          docker tag "$SRC" "$LATEST"
          docker push "$LATEST"

  # Optional dev cluster — skipped when ECS_CLUSTER_DEV empty
  deploy-dev:
    needs: [detect, build-push]
    if: |
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      vars.ECS_CLUSTER_DEV != '' &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy service
        run: |
          set -euo pipefail
          CLUSTER="${{ vars.ECS_CLUSTER_DEV }}"
          IMAGE=$ECR_REGISTRY/sync/${{ matrix.service }}:${GITHUB_SHA}
          bash .github/scripts/ecs-deploy.sh "$CLUSTER" "sync-dev-${{ matrix.service }}" "$IMAGE"
          if [ "${{ matrix.service }}" = "ai" ]; then
            bash .github/scripts/ecs-deploy.sh "$CLUSTER" "sync-dev-ai-worker" "$IMAGE"
          fi

  deploy-prod:
    needs: [detect, build-push, deploy-dev]
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      vars.ECS_CLUSTER_PROD != '' &&
      needs.build-push.result == 'success' &&
      (needs.deploy-dev.result == 'success' || needs.deploy-dev.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS prod
        env:
          # Only raise desired when already >0 (won't unpark workers that are at 0).
          ECS_MIN_DESIRED: "1"
          # Pack tighter: concurrent full-fleet deploy was failing RESOURCE:MEMORY on t4g.medium.
          ECS_TASK_MEMORY: "320"
          ECS_TASK_CPU: "128"
        run: |
          set -euo pipefail
          export CLUSTER="${{ vars.ECS_CLUSTER_PROD }}"
          IMAGE=$ECR_REGISTRY/sync/${{ matrix.service }}:${GITHUB_SHA}
          case "${{ matrix.service }}" in
            iam|ai) export ECS_TASK_MEMORY=512 ECS_TASK_CPU=192 ;;
            gateway|rcm) export ECS_TASK_MEMORY=384 ECS_TASK_CPU=128 ;;
          esac
          if [ "${{ matrix.service }}" = "gateway" ] && [ "${{ vars.GATEWAY_BLUEGREEN }}" = "true" ]; then
            bash .github/scripts/ecs-bluegreen.sh "sync-prod-gateway" "$IMAGE"
          else
            bash .github/scripts/ecs-deploy.sh "$CLUSTER" "sync-prod-${{ matrix.service }}" "$IMAGE"
            if [ "${{ matrix.service }}" = "ai" ]; then
              # Worker: update image only; stay at desired=0 unless already running / FORCE_UNPARK
              # (unparking worker on tight Spot fleets causes RESOURCE:MEMORY for others).
              ECS_TASK_MEMORY=384 ECS_TASK_CPU=128 \
                bash .github/scripts/ecs-deploy.sh "$CLUSTER" "sync-prod-ai-worker" "$IMAGE"
            fi
          fi
      - name: Smoke (gateway job only)
        if: matrix.service == 'gateway'
        run: |
          URL="${{ vars.SYNC_PUBLIC_URL_PROD }}"
          if [ -n "$URL" ]; then
            curl -fsS "$URL/health" || curl -fsS "$URL/healthz" || (echo "smoke failed" && exit 1)
          else
            echo "WARN: SYNC_PUBLIC_URL_PROD empty — skip smoke"
          fi

  deploy-web-prod:
    needs: [detect]
    if: |
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      needs.detect.outputs.web == 'true' &&
      vars.WEB_BUCKET_PROD != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/web/package-lock.json }
      - name: Build static export
        working-directory: ui/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.SYNC_PUBLIC_URL_PROD }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_AWS_MAP_API_KEY: ${{ vars.NEXT_PUBLIC_AWS_MAP_API_KEY }}
          NEXT_PUBLIC_AWS_MAP_REGION: ${{ vars.NEXT_PUBLIC_AWS_MAP_REGION || 'ap-southeast-1' }}
          NEXT_PUBLIC_AWS_MAP_NAME: ${{ vars.NEXT_PUBLIC_AWS_MAP_NAME || 'sync-map' }}
          NEXT_PUBLIC_AWS_MAP_STYLE: ${{ vars.NEXT_PUBLIC_AWS_MAP_STYLE || 'Hybrid' }}
          NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${{ vars.NEXT_PUBLIC_LEGAL_ENTITY_NAME }}
          NEXT_PUBLIC_LEGAL_ENTITY_NAME_EN: ${{ vars.NEXT_PUBLIC_LEGAL_ENTITY_NAME_EN }}
          NEXT_PUBLIC_LEGAL_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_LEGAL_SUPPORT_EMAIL }}
          NEXT_PUBLIC_LEGAL_SUPPORT_PHONE: ${{ vars.NEXT_PUBLIC_LEGAL_SUPPORT_PHONE }}
          NEXT_PUBLIC_LEGAL_WEBSITE: ${{ vars.NEXT_PUBLIC_LEGAL_WEBSITE }}
          NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE: ${{ vars.NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE }}
          NEXT_PUBLIC_LEGAL_PLAY_PACKAGE_NAME: ${{ vars.NEXT_PUBLIC_LEGAL_PLAY_PACKAGE_NAME }}
        run: |
          npm ci
          npm run build
          test -d out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync S3 + CloudFront
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET_PROD }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID_PROD }}
        run: |
          set -euo pipefail
          aws s3 sync ui/web/out/ "s3://${WEB_BUCKET}/" --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "_next/static/*"
          aws s3 sync ui/web/out/_next/static/ "s3://${WEB_BUCKET}/_next/static/" \
            --cache-control "public,max-age=31536000,immutable"
          if [ -n "${WEB_DISTRIBUTION_ID}" ]; then
            ID=$(aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Id' --output text)
            aws cloudfront wait invalidation-completed --distribution-id "$WEB_DISTRIBUTION_ID" --id "$ID"
          fi
