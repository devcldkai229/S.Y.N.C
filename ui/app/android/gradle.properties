# Release minify + plugin lint needs more Metaspace than a tiny daemon.
# Keep workers=1 on 16GB machines that also run emulator/Android Studio.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.incremental=false
android.useAndroidX=true
# Skip lintVital on release — avoids Metaspace OOM during assembleRelease locally/CI.
android.lint.checkReleaseBuilds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
