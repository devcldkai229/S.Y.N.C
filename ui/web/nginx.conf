server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker maps host:3000 → container:80. Default absolute redirects drop the
    # published port (Location: http://host/path/ without :3000) and break browsers.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Next static export uses trailingSlash: true → folders with index.html.
    # Without this, /privacy 301-redirects wrongly; with relative redirects it works.
    location / {
        # Prefer exact static export paths; 404 instead of silently serving the homepage.
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
